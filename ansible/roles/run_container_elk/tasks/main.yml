---
- name: Убеждаемся, что директория существует
  ansible.builtin.file:
    path: "/home/{{ user_name }}/elk/"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'

- name: Копируем compose.yml
  ansible.builtin.copy:
    src: compose.yml
    dest: "/home/{{ user_name }}/elk/compose.yml"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'

- name: Запускаем только Elasticsearch для генерации токена
  community.docker.docker_compose_v2:
    project_src: "/home/{{ user_name }}/elk"
    services: 
      - elasticsearch
    state: present
    pull: missing

- name: Ждем загрузки Elasticsearch и проверяем наличие токенов
  shell: docker exec elasticsearch bin/elasticsearch-service-tokens list
  register: existing_tokens
  changed_when: false
  failed_when: false
  retries: 12
  delay: 10 
  until: existing_tokens.rc == 0

- name: Удаляем старый токен Kibana, если он существует
  shell: docker exec elasticsearch bin/elasticsearch-service-tokens delete elastic/kibana kibana-compose
  when: "'kibana-compose' in existing_tokens.stdout"
  changed_when: true

- name: Генерируем новый токен для Kibana
  shell: docker exec elasticsearch bin/elasticsearch-service-tokens create elastic/kibana kibana-compose
  register: token_generation_output
  changed_when: true

- name: Извлекаем сгенерированный токен из вывода
  set_fact:
    kibana_generated_token: "{{ token_generation_output.stdout | regex_search('AAEAA[^\\s]+') }}"

- name: Выводим информацию о сгенерированном токене
  debug:
    msg: "Новый токен успешно сгенерирован: {{ kibana_generated_token }}"

- name: Создаем файл .env из шаблона (с подстановкой токена)
  ansible.builtin.template:
    src: .env.j2
    dest: "/home/{{ user_name }}/elk/.env"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'

- name: Запускаем весь ELK-стек целиком
  community.docker.docker_compose_v2:
    project_src: "/home/{{ user_name }}/elk"
    state: present